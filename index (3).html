  <style>
    @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {

    .simbolo svg { width: 100%; height: auto; display: block; overflow: visible; }
    .marca { margin: 28px 0 0; font-size: clamp(34px, 7vw, 52px); letter-spacing: -0.03em; line-height: 1; font-weight: 400; }
    .marca b { font-weight: 800; color: #FFFFFF; }
    .marca span { font-weight: 500; color: #C9A84C; }
    .traco { width: 64px; height: 3px; border-radius: 2px; margin: 22px auto; background: linear-gradient(90deg, #BE9C42, #D9BD66, #BE9C42); }
    .assinatura { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #C9A84C; }
    .aviso { margin: 36px 0 0; max-width: 34ch; font-size: clamp(18px, 2.4vw, 21px); line-height: 1.5; color: #C3CCD9; text-wrap: balance; }
    .aviso strong { color: #FFFFFF; font-weight: 650; }
    .contato { margin: 22px 0 0; font-size: 15px; color: #94A3B8; }
    .contato a { color: #C9A84C; font-weight: 600; text-underline-offset: 3px; }
    .contato a:focus-visible { outline: 3px solid #C9A84C; outline-offset: 3px; border-radius: 4px; }
    footer { padding: 20px 16px 28px; text-align: center; font-size: 13px; color: #7C8BA1; }
    /* Animação do símbolo (a mesma do site) */
    .sv-no { opacity: 0; transform-box: fill-box; transform-origin: center; animation: sv-no .6s ease-out forwards; }
    .sv-no--centro { animation-delay: .15s; } .sv-no--banco { animation-delay: 1.15s; }
    .sv-no--doc { animation-delay: 1.55s; } .sv-no--caminhao { animation-delay: 1.95s; }
    .sv-revela { stroke-dasharray: 160; stroke-dashoffset: 160; animation: sv-linha .8s ease-in-out forwards; }
    .sv-revela--banco { animation-delay: .6s; } .sv-revela--doc { animation-delay: 1.0s; } .sv-revela--caminhao { animation-delay: 1.4s; }
    .sv-orbita { opacity: 0; animation: sv-fade 1.4s ease-out 1.9s forwards; }
    @keyframes sv-no { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }
    @keyframes sv-linha { to { stroke-dashoffset: 0; } }
    @keyframes sv-fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .sv-no, .sv-orbita { opacity: 1; animation: none; }
      .sv-revela { stroke-dashoffset: 0; animation: none; }
    }
  </style>
</head>
